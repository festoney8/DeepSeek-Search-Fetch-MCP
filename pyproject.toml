[project]
name = "deepseek-search-fetch-mcp"
version = "0.1.0"
description = "MCPs for DeepSeek Search API and Fetch API."
readme = "README.md"
authors = [{ name = "festoney8", email = "festoney8@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "fastmcp>=4.1.3",
    "iso639-lang>=2.6.3",
    "pydantic>=2.14.1",
    "validators>=0.36.0",
]

[project.scripts]
deepseek-search-fetch-mcp = "deepseek_search_fetch_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
extend-exclude = ["migrations", "dist"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "ARG001"]
